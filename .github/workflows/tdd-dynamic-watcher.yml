name: TDD Dynamic Watcher

on:
  push:
    branches:
      - fix/dynamic-fsnotify-subdirs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Regression test
        working-directory: server
        run: go test -count=1 ./internal/sensor/git -run TestSensorWatchesDirectoryCreatedAfterStart
