    - generic [ref=f19e48]:
      - paragraph [ref=f19e49]: DSH OTel
      - heading "Telemetría de DeepSeek Harness, como OpenTelemetry puro." [level=1] [ref=f19e50]
      - paragraph [ref=f19e51]:
        - text: Sin collector. Sin sidecar. Sin forkear DSH. Se instala como un plugin común de
        - link "DeepSeek Harness" [ref=f19e52] [cursor=pointer]:
          - /url: https://github.com/deepseek-ai/deepseek-harness
        - text: ", y cada turno, llamada al modelo y ejecución de herramienta pasa a ser una fila consultable en"
        - link "GreptimeDB" [ref=f19e53] [cursor=pointer]:
          - /url: https://github.com/GreptimeTeam/greptimedb
        - text: .
      - generic [ref=f19e54]:
        - link "npm" [ref=f19e55] [cursor=pointer]:
          - /url: https://www.npmjs.com/package/@tma1-ai/dsh-plugin-greptimedb
        - link "CI" [ref=f19e56] [cursor=pointer]:
          - /url: https://github.com/tma1-ai/dsh-otel/actions/workflows/ci.yml
        - link "node ≥ 22.19" [ref=f19e57] [cursor=pointer]:
          - /url: https://nodejs.org
        - link "Apache-2.0" [ref=f19e58] [cursor=pointer]:
          - /url: https://github.com/tma1-ai/dsh-otel/blob/main/LICENSE
      - generic [ref=f19e59]:
        - paragraph [ref=f19e60]: INSTALACIÓN
        - generic [ref=f19e61]:
          - paragraph [ref=f19e62]: dsh plugin --profile headless add @tma1-ai/dsh-plugin-greptimedb
          - button "Copiar" [ref=f19e63] [cursor=pointer]
        - paragraph [ref=f19e64]:
          - text: El paquete trae un bundle patch, así que ese único comando lo conecta al profile.
          - code [ref=f19e65]: dsh plugin
          - text: delega en el
          - code [ref=f19e66]: pnpm
          - text: que esté en tu PATH, y un directorio de profile de dsh es su propio workspace root de pnpm — pnpm 9 se niega a instalar ahí e ignora la configuración de linker que escribe dsh, así que usá pnpm 10 o superior. Los valores por defecto ya apuntan a un GreptimeDB local.
      - group [ref=f19e67]:
        - generic "Apuntalo a tu propia base de datos, o levantá una local" [ref=f19e68] [cursor=pointer]
      - generic [ref=f19e69]:
        - generic [ref=f19e70]:
          - generic [ref=f19e71]: greptimedb · sql
          - generic [ref=f19e76]:
            - generic [ref=f19e77]: "-- Las llamadas a herramientas más lentas, con el modelo que las pidió."
            - generic [ref=f19e79]: SELECT tool.span_name,
            - generic [ref=f19e81]: chat."span_attributes.gen_ai.request.model" AS model,
            - generic [ref=f19e83]: tool.duration_nano / 1000000 AS ms
            - generic [ref=f19e85]: FROM opentelemetry_traces AS tool
            - generic [ref=f19e87]: JOIN opentelemetry_traces AS chat
            - generic [ref=f19e89]: ON chat.trace_id = tool.trace_id
            - generic [ref=f19e91]: AND chat."span_attributes.dsh.step" = tool."span_attributes.dsh.step"
            - generic [ref=f19e93]: AND chat.span_name LIKE 'chat%'
            - generic [ref=f19e95]: WHERE tool.span_name LIKE 'execute_tool%'
            - generic [ref=f19e97]: ORDER BY tool.duration_nano DESC
            - generic [ref=f19e99]: LIMIT 10;
        - paragraph [ref=f19e101]:
          - text: Los spans de chat y los de herramienta comparten trace y
          - code [ref=f19e102]: dsh.step
          - text: ", así que correlacionarlos es un join de SQL común. Cada timestamp viene del evento de sesión al que pertenece, no de leer el reloj mientras se procesa el evento."
      - generic [ref=f19e103]:
