            - generic [ref=f18e77]: "-- Las llamadas a herramientas más lentas, con el modelo que las pidió."
            - generic [ref=f18e79]: SELECT tool.span_name,
            - generic [ref=f18e81]: chat."span_attributes.gen_ai.request.model" AS model,
            - generic [ref=f18e83]: tool.duration_nano / 1000000 AS ms
            - generic [ref=f18e85]: FROM opentelemetry_traces AS tool
            - generic [ref=f18e87]: JOIN opentelemetry_traces AS chat
            - generic [ref=f18e89]: ON chat.trace_id = tool.trace_id
            - generic [ref=f18e91]: AND chat."span_attributes.dsh.step" = tool."span_attributes.dsh.step"
            - generic [ref=f18e93]: AND chat.span_name LIKE 'chat%'
            - generic [ref=f18e95]: WHERE tool.span_name LIKE 'execute_tool%'
            - generic [ref=f18e97]: ORDER BY tool.duration_nano DESC
            - generic [ref=f18e99]: LIMIT 10;
        - paragraph [ref=f18e101]:
          - text: Los spans de chat y los de herramienta comparten trace y
          - code [ref=f18e102]: dsh.step
          - text: ", así que correlacionarlos es un join de SQL común. Cada timestamp viene del evento de sesión al que pertenece, no de leer el reloj mientras se procesa el evento."
