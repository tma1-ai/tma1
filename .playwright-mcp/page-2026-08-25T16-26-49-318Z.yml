            - text: .
        - article [ref=f18e448]:
          - heading "<code>ttl</code> no llega a las tablas de métricas" [level=4] [ref=f18e449]
          - paragraph [ref=f18e450]:
            - text: Las métricas caen en el metric engine, donde la retención es una propiedad de la tabla física. El hint llega a la tabla lógica, que lo guarda y lo muestra pero nunca lo aplica (
            - link "greptimedb#8951" [ref=f18e451] [cursor=pointer]:
              - /url: https://github.com/GreptimeTeam/greptimedb/issues/8951
            - text: ). Ponelo vos con
            - code [ref=f18e452]: ALTER TABLE greptime_physical_table SET 'ttl' = '180d'
            - text: .
        - article [ref=f18e453]:
          - heading "La exportación es por lotes y el apagado es acotado" [level=4] [ref=f18e454]
          - paragraph [ref=f18e455]:
            - text: No hay flush por turno — la exportación sigue la cadencia de los batch processors. Los registros en vuelo cuando expira
            - code [ref=f18e456]: shutdownTimeoutMillis
            - text: pueden perderse al salir.
        - article [ref=f18e457]:
          - heading "Las sesiones de subagente tienen su propio trace" [level=4] [ref=f18e458]
          - paragraph [ref=f18e459]: No se cosen dentro del trace padre.
