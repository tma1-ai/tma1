      - paragraph [ref=f18e49]: DSH OTel
      - heading "Telemetría de DeepSeek Harness, como OpenTelemetry puro." [level=1] [ref=f18e50]
      - paragraph [ref=f18e51]:
        - text: Sin collector. Sin sidecar. Sin forkear DSH. Se instala como un plugin común de
        - link "DeepSeek Harness" [ref=f18e52] [cursor=pointer]:
          - /url: https://github.com/deepseek-ai/deepseek-harness
        - text: ", y cada turno, llamada al modelo y ejecución de herramienta pasa a ser una fila consultable en"
        - link "GreptimeDB" [ref=f18e53] [cursor=pointer]:
          - /url: https://github.com/GreptimeTeam/greptimedb
        - text: .
      - generic [ref=f18e54]:
        - link "npm" [ref=f18e55] [cursor=pointer]:
          - /url: https://www.npmjs.com/package/@tma1-ai/dsh-plugin-greptimedb
        - link "CI" [ref=f18e56] [cursor=pointer]:
          - /url: https://github.com/tma1-ai/dsh-otel/actions/workflows/ci.yml
        - link "node ≥ 22.19" [ref=f18e57] [cursor=pointer]:
          - /url: https://nodejs.org
        - link "Apache-2.0" [ref=f18e58] [cursor=pointer]:
          - /url: https://github.com/tma1-ai/dsh-otel/blob/main/LICENSE
      - generic [ref=f18e59]:
        - paragraph [ref=f18e60]: INSTALACIÓN
        - generic [ref=f18e61]:
          - paragraph [ref=f18e62]: dsh plugin --profile headless add @tma1-ai/dsh-plugin-greptimedb
          - button "Copiar" [ref=f18e63] [cursor=pointer]
        - paragraph [ref=f18e64]:
          - text: El paquete trae un bundle patch, así que ese único comando lo conecta al profile.
          - code [ref=f18e65]: dsh plugin
          - text: delega en el
          - code [ref=f18e66]: pnpm
          - text: que esté en tu PATH, y un directorio de profile de dsh es su propio workspace root de pnpm — pnpm 9 se niega a instalar ahí e ignora la configuración de linker que escribe dsh, así que usá pnpm 10 o superior. Los valores por defecto ya apuntan a un GreptimeDB local.
      - group [ref=f18e67]:
        - generic "Apuntalo a tu propia base de datos, o levantá una local" [ref=f18e68] [cursor=pointer]
