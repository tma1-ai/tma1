    - generic [ref=f20e301]:
      - paragraph [ref=f20e302]: "> FAQ"
      - heading "常见问题" [level=2] [ref=f20e303]
      - generic [ref=f20e304]:
        - article [ref=f20e305]:
          - heading "支持哪些 agent？" [level=3] [ref=f20e306]
          - paragraph [ref=f20e307]:
            - text: 任何发送 OpenTelemetry 数据的 agent，以及通过 JSONL 自动发现的几个 agent。Claude Code 发送 metrics 和 logs；Codex 发送 logs 和 metrics，会话 JSONL 自动解析用于对话回放。GitHub Copilot CLI 零配置：TMA1 自动发现并解析
            - code [ref=f20e308]: ~/.copilot/session-state/
            - text: 下的 session JSONL。OpenClaw 发送 traces 和 metrics，会话 JSONL 也会自动解析。任何遵循 GenAI 语义规范的 OTel SDK 应用开箱即用。Dashboard 根据数据自动切换到对应视图。
        - article [ref=f20e309]:
          - heading "能直接用 SQL 查吗？" [level=3] [ref=f20e310]
          - paragraph [ref=f20e311]:
            - text: 能。运行
            - code [ref=f20e312]: mysql -h 127.0.0.1 -P 14002
            - text: 连接本地 SQL 端口，或打开
            - code [ref=f20e313]:
              - link "localhost:14000/dashboard/" [ref=f20e314] [cursor=pointer]:
                - /url: http://localhost:14000/dashboard/
            - text: 使用内置查询界面。Traces 在
            - code [ref=f20e315]: opentelemetry_traces
            - text: ，logs 在
            - code [ref=f20e316]: opentelemetry_logs
            - text: ，session 数据在
            - code [ref=f20e317]: tma1_hook_events
            - text: 和
            - code [ref=f20e318]: tma1_messages
            - text: ，OTel metrics 自动建表。
        - article [ref=f20e319]:
          - heading "大概占多少磁盘？" [level=3] [ref=f20e320]
          - paragraph [ref=f20e321]: 取决于 agent 流量和对话长度。常见场景下，每月大约几百 MB。
